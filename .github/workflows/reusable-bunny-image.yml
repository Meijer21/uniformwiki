name: Reusable Bunny image

on:
  workflow_call:
    inputs:
      image:
        description: Volledige image, bijv. ghcr.io/meijer21/uniformwiki
        required: true
        type: string
      image_title:
        required: false
        type: string
        default: App
      package_name:
        description: GHCR-package zonder namespace (voor public-zetten)
        required: false
        type: string
        default: ""
      bunny_container:
        required: true
        type: string
      bunny_app_id:
        required: false
        type: string
        default: ""
    secrets:
      BUNNYNET_API_KEY:
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUNNY_KEY_SET: ${{ secrets.BUNNYNET_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.image }}:latest
            ${{ inputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ inputs.image_title }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package openbaar maken voor Bunny
        if: ${{ inputs.package_name != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ inputs.package_name }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PKG}/visibility" \
            -f visibility=public

      - name: Rolling update Magic Container
        if: ${{ env.BUNNY_KEY_SET == 'true' && inputs.bunny_app_id != '' }}
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ inputs.bunny_app_id }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ inputs.bunny_container }}
          image_tag: ${{ github.sha }}
