name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-bunny-image.yml
    with:
      image: ghcr.io/meijer21/uniformwiki
      image_title: UniformWiki
      package_name: uniformwiki
      bunny_container: uniformwiki
      bunny_app_id: ${{ vars.BUNNY_APP_ID || 'JvU6ASVcm2kmxOy' }}
    secrets:
      BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
