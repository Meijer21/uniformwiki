name: Fix wiki.thisline.eu

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Alleen wiki.thisline.eu instellen
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: node scripts/fix-wiki-hostname.mjs
